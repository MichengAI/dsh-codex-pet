name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 执行完整检查
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: actions/github-script@v8
        with:
          script: |
            // 手动检查及发布调用始终执行完整检查；普通推送只跳过展示文档。
            if (${{ inputs.full == true }}) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const base = context.eventName === 'pull_request'
              ? context.payload.pull_request.base.sha : context.payload.before;
            if (!base || /^0+$/.test(base) || context.ref.startsWith('refs/tags/')) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const { execFileSync } = require('node:child_process');
            const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', base, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const presentation = /^(?:README(?:\.[^/]+)?\.md|CHANGELOG(?:\.[^/]+)?\.md|docs\/.*|assets\/(?:branding|screenshots)\/.*)$/;
            const run = files.some(file => !presentation.test(file));
            core.setOutput('run_tests', String(run));
            core.info(run ? '执行完整检查' : '仅说明或展示图片变更，跳过完整测试');

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: 校验完整发布包
        run: npm pack --pack-destination "$RUNNER_TEMP"

  e2e:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: e2e (${{ matrix.dsh }}, ${{ matrix.locale }})
    strategy:
      fail-fast: false
      matrix:
        locale: [zh-CN, en-US]
        dsh: [0.1.0-rc.8, 0.1.1-rc.2, 0.1.2-rc.1, 0.1.5-rc.1, 0.1.5-rc.2, 0.1.7-rc.1]
    env:
      DSH_PET_E2E_VERSION: ${{ matrix.dsh }}
      DSH_PET_E2E_LOCALE: ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 保留端到端诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.dsh }}-${{ matrix.locale }}
          include-hidden-files: true
          retention-days: 7
          path: |
            .preview/e2e-latest-*/*.log
            .preview/e2e-latest-*/result.json
            .preview/e2e-latest-*/*.png
            .preview/e2e-latest-*/failure.txt
